<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar Events - Community Calendar</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">
        <h1>📅 Community Events Calendar</h1>
      </div>
      <div class="nav-menu">
        <span id="userDisplay" class="user-display"></span>
        <button id="suggestBtn" class="btn btn-secondary">+ Suggest Event</button>
        <a id="modBtn" href="/moderation" class="btn btn-secondary" style="display: none;">Moderation</a>
        <button id="logoutBtn" class="btn btn-danger">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-container">
    <!-- Calendar Section -->
    <section class="calendar-section">
      <div class="calendar-header">
        <button id="prevMonth" class="btn btn-small">← Previous</button>
        <h2 id="monthDisplay"></h2>
        <button id="nextMonth" class="btn btn-small">Next →</button>
      </div>

      <div class="calendar-wrapper">
        <table id="calendar" class="calendar">
          <thead>
            <tr>
              <th>Sun</th>
              <th>Mon</th>
              <th>Tue</th>
              <th>Wed</th>
              <th>Thu</th>
              <th>Fri</th>
              <th>Sat</th>
            </tr>
          </thead>
          <tbody id="calendarBody">
            <!-- Generated by JavaScript -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- Upcoming Events Sidebar -->
    <section class="events-sidebar">
      <h3>Upcoming Events</h3>
      <div id="eventsList" class="events-list">
        <!-- Populated by JavaScript -->
      </div>
    </section>
  </main>

  <!-- Event Detail Modal -->
  <div id="eventModal" class="modal">
    <div class="modal-content">
      <span class="modal-close">&times;</span>
      <h2 id="modalTitle"></h2>
      <div id="modalBody" class="modal-body">
        <!-- Populated by JavaScript -->
      </div>
    </div>
  </div>

  <!-- Suggest Event Modal -->
  <div id="suggestModal" class="modal">
    <div class="modal-content">
      <span class="modal-close">&times;</span>
      <h2>Suggest New Event</h2>
      <form id="suggestForm" class="event-form">
        <div class="form-group">
          <label for="eventTitle">Event Title *</label>
          <input
            type="text"
            id="eventTitle"
            required
            placeholder="e.g., Community Yoga Class"
          >
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="eventDateStart">Start Date *</label>
            <input
              type="date"
              id="eventDateStart"
              required
            >
          </div>
          <div class="form-group">
            <label for="eventDateEnd">End Date *</label>
            <input
              type="date"
              id="eventDateEnd"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="todoInput">Add To-Do Items</label>
          <div class="todo-input-group">
            <input
              type="text"
              id="todoInput"
              placeholder="e.g., Prepare materials"
            >
            <button type="button" id="addTodoBtn" class="btn btn-small">Add</button>
          </div>
          <ul id="todoList" class="todo-list">
            <!-- Added todos appear here -->
          </ul>
        </div>

        <div class="form-actions">
          <button type="submit" id="submitEventBtn" class="btn btn-primary">Submit for Approval</button>
          <button type="button" class="btn btn-secondary close-modal">Cancel</button>
        </div>

        <div id="suggestError" class="error-message"></div>
        <div id="suggestSuccess" class="success-message"></div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/calendar.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
